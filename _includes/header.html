<header class="site-header">
  <div class="header-inner">
    <a class="site-logo" href="{{ '/' | relative_url }}">
      <div class="logo-icon">🏸</div>
      <div class="logo-text">
        <span class="logo-title">A.S.S.B. Badminton</span>
        <span class="logo-sub">Saint-Branchs</span>
      </div>
    </a>

    <button class="nav-toggle" aria-label="Menu" onclick="this.classList.toggle('open'); document.getElementById('site-nav').classList.toggle('open')">
      <span></span><span></span><span></span>
    </button>

    <nav class="site-nav" id="site-nav">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="active"{% endif %}>Accueil</a>
      {%- for path in site.header_pages -%}
        {%- assign my_page = site.pages | where: "path", path | first -%}
        {%- if my_page.title -%}
          <a href="{{ my_page.url | relative_url }}"{% if page.url == my_page.url %} class="active"{% endif %}>{{ my_page.title | escape }}</a>
        {%- endif -%}
      {%- endfor -%}
    </nav>
  </div>
</header>
